version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kinematics_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/kinematics_hub
      SECRET_KEY: dev_secret_key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/auth-service:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - auth-service
      - community-service
      - events-service

  community-service:
    build: ./services/community-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/kinematics_hub
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/community-service:/app

  events-service:
    build: ./services/events-service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/kinematics_hub
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/events-service:/app

  projects-service:
    build: ./services/projects-service
    ports:
      - "8003:8003"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/kinematics_hub
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/projects-service:/app

  tools-service:
    build: ./services/tools-service
    ports:
      - "8004:8004"
    volumes:
      - ./services/tools-service:/app

  chat-service:
    build: ./services/chat-service
    ports:
      - "8005:8005"
    volumes:
      - ./services/chat-service:/app

  llm-gateway:
    build: ./services/llm-gateway
    ports:
      - "8006:8006"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/kinematics_hub
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/llm-gateway:/app

  papers-service:
    build: ./services/papers-service
    ports:
      - "8007:8007"
    volumes:
      - ./services/papers-service:/app

  news-service:
    build: ./services/news-service
    ports:
      - "8008:8008"
    volumes:
      - ./services/news-service:/app

volumes:
  postgres_data:
